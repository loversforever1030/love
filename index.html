<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>♡</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background:
        radial-gradient(circle at 20% 20%, #ffdce9 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #ffc6da 0%, transparent 30%),
        linear-gradient(135deg, #fff4f8, #ffe1ec);
    color: #6d2945;
    overflow-x: hidden;
}

.page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 18px 100px;
    position: relative;
}

/* Floating hearts */

.floating-heart {
    position: fixed;
    color: #e8759c;
    opacity: 0.35;
    font-size: 24px;
    pointer-events: none;
    animation: float 5s ease-in-out infinite;
}

.h1 {
    top: 12%;
    left: 10%;
}

.h2 {
    top: 25%;
    right: 9%;
    animation-delay: 1s;
}

.h3 {
    bottom: 25%;
    left: 8%;
    animation-delay: 2s;
}

.h4 {
    bottom: 15%;
    right: 12%;
    animation-delay: 3s;
}

@keyframes float {
    50% {
        transform: translateY(-15px) rotate(8deg);
    }
}

/* Machine */

.machine {
    width: min(380px, 94vw);
    background: linear-gradient(
        145deg,
        #fffafa,
        #ffe4ed
    );

    border: 4px solid #eca0b9;
    border-radius: 35px;

    padding: 24px 20px 28px;

    box-shadow:
        0 25px 60px rgba(157, 45, 86, 0.22),
        inset 0 2px 0 white;

    position: relative;
}

/* Little screws */

.screw {
    position: absolute;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #d88aa5;
    box-shadow: inset 1px 1px 2px #ffffff;
}

.screw.one {
    top: 13px;
    left: 15px;
}

.screw.two {
    top: 13px;
    right: 15px;
}

.screw.three {
    bottom: 13px;
    left: 15px;
}

.screw.four {
    bottom: 13px;
    right: 15px;
}

/* Display */

.display {
    min-height: 125px;

    margin: 5px 0 24px;

    padding: 20px 15px;

    border-radius: 18px;

    background: #fffafb;

    border: 2px solid #f0b4c8;

    box-shadow:
        inset 0 5px 15px rgba(130, 40, 70, 0.08),
        0 3px 5px rgba(255, 255, 255, 0.8);

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    font-size: clamp(20px, 5vw, 27px);

    line-height: 1.35;

    color: #9b3158;

    transition: 0.3s;
}

.display.show {
    animation: messagePop 0.45s ease;
}

@keyframes messagePop {

    0% {
        opacity: 0;
        transform: scale(0.85);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

/* Heart button */

.heart-button {
    display: flex;
    justify-content: center;
    align-items: center;

    width: 125px;
    height: 125px;

    margin: auto;

    border: none;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ff759d,
            #d82f67
        );

    color: white;

    font-size: 62px;

    cursor: pointer;

    box-shadow:
        0 10px 0 #a8234f,
        0 18px 30px rgba(164, 35, 79, 0.35);

    transition: transform 0.12s, box-shadow 0.12s;
}

.heart-button:hover {
    transform: scale(1.04);
}

.heart-button:active {
    transform: translateY(9px) scale(0.98);

    box-shadow:
        0 2px 0 #a8234f,
        0 8px 15px rgba(164, 35, 79, 0.3);
}

/* Bottom heart + quote */

.bottom {
    position: fixed;

    bottom: 15px;
    left: 50%;

    transform: translateX(-50%);

    width: 90%;

    text-align: center;

    pointer-events: none;
}

.bottom-heart {
    font-size: 35px;

    color: #d71950;

    text-shadow:
        0 5px 18px rgba(215, 25, 80, 0.4);

    animation: heartbeat 1.7s infinite ease-in-out;
}

@keyframes heartbeat {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }
}

.quote {
    margin-top: 3px;

    font-size: 14px;

    font-style: italic;

    color: #71334b;

    opacity: 0.75;
}

/* Mobile */

@media (max-width: 420px) {

    .machine {
        padding: 22px 17px 25px;
    }

    .display {
        min-height: 115px;
    }

    .heart-button {
        width: 115px;
        height: 115px;
        font-size: 55px;
    }

    .quote {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="floating-heart h1">♡</div>
    <div class="floating-heart h2">♥</div>
    <div class="floating-heart h3">♡</div>
    <div class="floating-heart h4">♥</div>

    <div class="machine">

        <div class="screw one"></div>
        <div class="screw two"></div>
        <div class="screw three"></div>
        <div class="screw four"></div>

        <div
            class="display"
            id="message"
        >
            ♡
        </div>

        <button
            class="heart-button"
            onclick="nextMessage()"
            aria-label="Press the heart"
        >
            ♥
        </button>

    </div>

</div>


<div class="bottom">

    <div class="bottom-heart">
        ♥
    </div>

    <div class="quote">
        “You are my favorite thought.”
    </div>

</div>


<script>

/*
    ==========================================
    YOUR MESSAGES
    ==========================================

    Replace these with your own messages.

    Every time she presses the heart,
    the next message appears.
*/

const messages = [

    "You are so beautiful. ♡",

    "I hope you know how much you mean to me.",

    "You make my world a little more beautiful.",

    "I would choose you again and again.",

    "Your smile is one of my favorite things.",

    "You deserve all the love in the world.",

    "I made this little heart just for you. ❤️",

    "If you are smiling right now, it worked. ♡",

    "You are my favorite person.",

    "I love every little thing that makes you you.",

    "Somehow, you become prettier every time I see you.",

    "I am lucky to have you.",

    "This heart belongs to you. ❤️",

    "You will always have a special place in my heart.",

    "One more press... I still have something to say. ♡"

];


/*
    ==========================================
    BOTTOM QUOTE
    ==========================================

    Change this to whatever quote you want.
*/

const bottomQuote =
    "“You are my favorite thought.”";


document.querySelector(".quote").textContent = bottomQuote;


let messageIndex = -1;


function nextMessage() {

    messageIndex++;

    /*
        When she reaches the last message,
        start again from the first one.
    */

    if (messageIndex >= messages.length) {
        messageIndex = 0;
    }

    const display =
        document.getElementById("message");

    display.classList.remove("show");

    /*
        Restart animation.
    */

    void display.offsetWidth;

    display.textContent =
        messages[messageIndex];

    display.classList.add("show");

}


</script>

</body>
</html>
